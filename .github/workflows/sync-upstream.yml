name: Sync fork with upstream

on:
  schedule:
    # Once a month, first day (UTC)
    # Upstream was archived Aug 26, 2026 and is now read-only.
    # Monthly sync monitors for any future unarchive/resumption;
    # set the cron to "5 4 * * 1" for weekly checks instead
    - cron: "5 4 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "Attempting fast-forward sync..."
          if ! gh repo sync ${{ github.repository }} -b master; then
            echo "Fast-forward failed (diverged fork?), performing hard reset..."
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
            cd repo
            git remote add upstream https://github.com/zedeus/nitter.git
            git fetch upstream master
            git checkout master
            git reset --hard upstream/master
            git push origin master --force
          else
            echo "Fast-forward sync completed."
          fi
